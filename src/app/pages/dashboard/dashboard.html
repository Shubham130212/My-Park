<div class="container-fluid p-4">
  <!-- Header Section -->
  <div class="row mb-4">
    <div class="col-md-6">
      <h2 class="fw-bold mb-1">Parking Dashboard</h2>
      <p class="text-muted">Manage and monitor parking spots</p>
    </div>
    <div class="col-md-6">
      <div class="d-flex justify-content-end align-items-center">
        <div class="input-group">
          <select class="form-select" [(ngModel)]="selectedSiteId" (change)="loadBuildings()">
            <option [ngValue]="null">Select Site</option>
            @for(site of siteList; track site.siteId) {
            <option [ngValue]="site.siteId">{{site.siteName}}</option>
            }
          </select>
          <select class="form-select" [(ngModel)]="selectedBuildingId" (change)="loadFloors()">
            <option value="null">Select Building</option>
            @for(building of buildingList; track building.buildingId) {
            <option [ngValue]="building.buildingId">{{building.buildingName}}</option>
            }
          </select>
          <select class="form-select" [(ngModel)]="selectedFloorId" (change)="loadParking()">
            <option value="null">Select Floor</option>
            @for(floor of floorList; track floor.floorId) {
            <option [ngValue]="floor.floorId">{{floor.floorNo}}</option>
            }
          </select>
          <button class="btn btn-outline-secondary" type="button">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Stats Cards Section -->
  <div class="row g-3 mb-4">
    <!-- Total Spots Card -->
    <div class="col-md-3">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <p class="text-muted mb-1 small">Total Spots</p>
            <h3 class="fw-bold mb-0">50</h3>
          </div>
          <div
            class="stat-icon bg-primary bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center"
            style="width: 50px; height: 50px;">
            <div class="bg-primary rounded-circle" style="width: 30px; height: 30px;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Available Card -->
    <div class="col-md-3">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <p class="text-muted mb-1 small">Available</p>
            <h3 class="fw-bold mb-0 text-success">28</h3>
          </div>
          <div
            class="stat-icon bg-success bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center"
            style="width: 50px; height: 50px;">
            <div class="bg-success rounded-circle" style="width: 30px; height: 30px;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Occupied Card -->
    <div class="col-md-3">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <p class="text-muted mb-1 small">Occupied</p>
            <h3 class="fw-bold mb-0 text-danger">22</h3>
          </div>
          <div class="stat-icon bg-danger bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center"
            style="width: 50px; height: 50px;">
            <div class="bg-danger rounded-circle" style="width: 30px; height: 30px;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Occupancy Rate Card -->
    <div class="col-md-3">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <p class="text-muted mb-1 small">Occupancy Rate</p>
            <h3 class="fw-bold mb-0 text-info">44%</h3>
          </div>
          <div class="stat-icon bg-info bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center"
            style="width: 50px; height: 50px;">
            <div class="bg-info rounded-circle" style="width: 30px; height: 30px;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Parking Layout Section -->
  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="fw-bold mb-0">Parking Layout</h5>
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-outline-secondary btn-sm">Refresh</button>
          <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" id="autoRefresh">
            <label class="form-check-label" for="autoRefresh"></label>
          </div>
        </div>
      </div>

      <!-- Legend -->
      <div class="d-flex gap-4 mb-4 flex-wrap">
        <div class="d-flex align-items-center gap-2">
          <span class="badge bg-success rounded-circle" style="width: 12px; height: 12px;"></span>
          <small class="text-muted">Total ({{parkingSpots.length}})</small>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="badge bg-success rounded-circle" style="width: 12px; height: 12px;"></span>
          <small class="text-muted">Available</small>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="badge bg-danger rounded-circle" style="width: 12px; height: 12px;"></span>
          <small class="text-muted">Occupied</small>
        </div>
      </div>

      <!-- Parking Grid -->
      <div class="parking-layout" id="parkingLayout ">
        @for(item of parkingSpots; track $index){
          <div class="parking-spot-available" data-id="1" data-status="available" (click)="openModal(item)">
            <i class="bi bi-p-square"></i>
            <div class="spot-number">{{item}}</div>
            <div class="spot-status">Available</div>
          </div>
        }
      </div>
    </div>
  </div>

  <!-- Booking Modal -->
  <div #bookModal class="modal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Book Parking Spot {{selectedSpot}}</h5>
          <button type="button" class="close text-white" (click)="closeModal()" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <form #bookingForm="ngForm" (ngSubmit)="onSubmit(bookingForm)">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" name="name" ngModel required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" ngModel required>
              </div>
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone" name="phone" ngModel required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="vehicleNumber" class="form-label">Vehicle Number</label>
                <input type="text" class="form-control" id="vehicleNumber" name="vehicleNumber" ngModel required>
              </div>
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="checkIn" class="form-label">Check-in Date & Time</label>
                <input type="datetime-local" class="form-control" id="checkIn" name="checkIn" ngModel required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="checkOut" class="form-label">Check-out Date & Time</label>
                <input type="datetime-local" class="form-control" id="checkOut" name="checkOut" ngModel required>
              </div>
            </div>
            
            <div class="row">
              <div class="col-12 mb-3">
                <label for="specialRequests" class="form-label">Special Requests (Optional)</label>
                <textarea class="form-control" id="specialRequests" name="specialRequests" rows="3" ngModel></textarea>
              </div>
            </div>
            
            <div class="d-flex justify-content-between align-items-center mt-4">
              <button type="button" class="btn btn-outline-secondary" (click)="closeModal()">
                <i class="bi bi-x-lg me-1"></i> Cancel
              </button>
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg me-1"></i> Confirm Booking
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
